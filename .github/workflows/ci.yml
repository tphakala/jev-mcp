name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# bash on every runner, Windows included (Git bash is preinstalled): the
# default PowerShell splits `-coverprofile=coverage.out` at the dot and go test
# then fails with ".out [setup failed]".
defaults:
  run:
    shell: bash

# A new push to a pull request cancels the run for the previous push; runs on
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both Linux architectures plus macOS and Windows: path handling, file
        # modes and signals differ per OS, and a pure-Go library is still
        # expected to work on all of them.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No job here pushes, so the GITHUB_TOKEN has no business sitting
          # in .git/config for the life of the job.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      # Coverage is informational (fail_ci_if_error: false), never a gate.
      # Only the Linux amd64 leg uploads. The token is optional for a public
      # repository but avoids Codecov's rate limit on tokenless uploads; add
      # CODECOV_TOKEN as a repository secret to use it.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      # .golangci-version is the single pin for the linter version; the local
      # `task tools` reads the same file, so local and CI runs use the same
      # binary.
      - name: Read the pinned golangci-lint version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.pin.outputs.version }}
          install-only: true
      - name: Verify the linter configuration
        run: golangci-lint config verify
      - name: Lint
        run: golangci-lint run
      - name: Compile the ruleguard matchers
        run: go vet -tags ruleguard ./rules/
      # The probe test skips when golangci-lint is missing or not the pinned
      # version; GOLANGCI_LINT_REQUIRED turns that skip into a failure here.
      - name: Check every ruleguard matcher fires on its probe
        env:
          GOLANGCI_LINT_REQUIRED: '1'
        run: go test -count=1 ./rules/rulestest/

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Verify module checksums
        run: go mod verify

  vet:
    name: Vet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run go vet
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
